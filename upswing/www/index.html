<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#140b22">
<title>Upswing</title>
<script src="capacitor.js"></script>
<style>
@font-face{font-family:"Lilita One";src:url("fonts/LilitaOne.woff2") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Nunito";src:url("fonts/Nunito.woff2") format("woff2");font-weight:200 1000;font-display:block}
/* Layout: one full-height play column; canvas world behind, HUD and overlays float above it */
:root{
  --ink:#140b22;      /* night */
  --ink-2:#22123a;    /* stage */
  --ember:#ffb547;    /* player + accents */
  --ring:#9ff0d0;     /* grab rings */
  --tide:#ff4d6d;     /* the rising danger */
  --paper:#f6eefc;    /* text */
  --muted:#b6a3cf;    /* secondary text */
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html{height:100%;background:var(--ink)}
[hidden]{display:none!important}
body{height:100%;margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#stage{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;touch-action:none;background:var(--ink-2);cursor:pointer}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.score{font-family:var(--display);font-size:3.4rem;line-height:1;text-align:center;letter-spacing:.02em;
  text-shadow:0 3px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums;transition:transform .12s}
.score.bump{transform:scale(1.18)}
.alt{font-size:.78rem;font-weight:800;color:var(--muted);text-align:center;letter-spacing:.14em;text-transform:uppercase;margin-top:2px;font-variant-numeric:tabular-nums}
.gems{justify-self:end;display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:1.25rem;padding-top:8px;font-variant-numeric:tabular-nums}
.gem-ico{width:12px;height:12px;background:var(--ring);transform:rotate(45deg);border-radius:2px;box-shadow:0 0 10px var(--ring)}
.icon-btn{justify-self:start;pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(246,238,252,.25);
  background:rgba(20,11,34,.45);color:var(--paper);display:grid;place-items:center;cursor:pointer;margin-top:4px}
.icon-btn:focus-visible,.swatch:focus-visible,.text-btn:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
.icon-btn svg{width:20px;height:20px}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(120% 70% at 50% 45%,rgba(20,11,34,.35),rgba(20,11,34,.82));animation:fade .25s ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.logo{font-family:var(--display);font-size:clamp(3.6rem,17vw,5.6rem);line-height:.9;margin:0;color:var(--ember);
  transform:rotate(-4deg);text-shadow:0 5px 0 #a3461f,0 0 40px rgba(255,181,71,.45);text-wrap:balance}
.logo span{display:inline-block;color:var(--paper);text-shadow:0 5px 0 #6c3fa0,0 0 30px rgba(159,240,208,.3)}
.how{max-width:30ch;margin:0;font-size:1rem;line-height:1.5;color:var(--paper);font-weight:600;text-wrap:balance}
.how b{color:var(--ring)}
.how em{font-style:normal;color:var(--tide);font-weight:800}
.stats{display:flex;gap:28px;justify-content:center}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stat .v{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.skins{display:flex;flex-direction:column;align-items:center;gap:10px}
.skins .k{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.swatches{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.swatch{position:relative;width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.swatch i{width:24px;height:24px;border-radius:50%;display:block}
.swatch[aria-pressed="true"]{border-color:var(--paper)}
.swatch[disabled]{cursor:default}
.swatch[disabled] i{opacity:.22;filter:grayscale(.6)}
.swatch small{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:.66rem;font-weight:800;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:3px}
.swatch small::before{content:"";width:6px;height:6px;background:var(--ring);transform:rotate(45deg);border-radius:1px}
.skin-name{font-weight:800;font-size:.9rem;min-height:1.2em;margin-top:8px}
.cta{font-family:var(--display);font-size:1.35rem;color:var(--ember);letter-spacing:.03em;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.97)}}
.cause{font-weight:800;color:var(--tide);letter-spacing:.14em;text-transform:uppercase;font-size:.8rem}
.big{font-family:var(--display);font-size:clamp(5rem,26vw,7.5rem);line-height:.9;font-variant-numeric:tabular-nums;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.badge{font-family:var(--display);background:var(--ember);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:1.05rem;transform:rotate(-3deg);animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(.3) rotate(-3deg)}}
.text-btn{pointer-events:auto;background:none;border:1.5px solid rgba(246,238,252,.3);color:var(--paper);font:800 .85rem var(--body);
  padding:10px 16px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.paused-note{font-size:.9rem;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.cta,.overlay,.badge{animation:none}.score{transition:none}}
</style>
</head>
<body>
<div id="stage" aria-label="Upswing game. Tap or press space to let go of the ring.">
  <canvas id="game"></canvas>

  <div class="hud" id="hud" hidden>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="Sound on"></button>
    <div>
      <div class="score" id="score">0</div>
      <div class="alt" id="alt">0 m</div>
    </div>
    <div class="gems"><span class="gem-ico"></span><span id="gemCount">0</span></div>
  </div>

  <div class="overlay" id="menu">
    <h1 class="logo">Up<span>swing</span></h1>
    <p class="how">Tap to <b>let go</b> of the ring. Fly close to the next one to grab it. Stay above the <em>rising tide</em>.</p>
    <div class="stats">
      <div class="stat"><span class="k">Best</span><span class="v" id="menuBest">0</span></div>
      <div class="stat"><span class="k">Gems</span><span class="v" id="menuGems">0</span></div>
    </div>
    <div class="skins">
      <span class="k">Your ember</span>
      <div class="swatches" id="swatches"></div>
      <div class="skin-name" id="skinName"></div>
    </div>
    <div class="cta">Tap anywhere to start</div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="cause" id="cause">The tide got you</div>
    <div class="big" id="finalScore">0</div>
    <div class="badge" id="newBest" hidden>New best!</div>
    <div class="stats">
      <div class="stat"><span class="k">Best</span><span class="v" id="overBest">0</span></div>
      <div class="stat"><span class="k">Altitude</span><span class="v" id="overAlt">0 m</span></div>
      <div class="stat"><span class="k">Gems</span><span class="v" id="overGems">+0</span></div>
    </div>
    <div class="cta" id="retry">Tap to swing again</div>
    <button class="text-btn" id="toMenu" type="button">Change ember</button>
  </div>

  <div id="insetProbe" aria-hidden="true" style="position:absolute;visibility:hidden;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)"></div>
  <div class="overlay" id="pausedOv" hidden>
    <div class="big" style="font-size:3.5rem">Paused</div>
    <div class="cta">Tap to keep swinging</div>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- native bridge (Capacitor on iOS; a plain browser falls back gracefully) ----------
const Cap = window.Capacitor;
const isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
const registerPlugin = (Cap && Cap.registerPlugin) || (window.capacitorExports && window.capacitorExports.registerPlugin);
const Haptics = isNative && registerPlugin ? registerPlugin('Haptics') : null;
const Prefs = isNative && registerPlugin ? registerPlugin('Preferences') : null;
function haptic(kind){
  if(Haptics){
    try{
      const r = kind === 'fail' ? Haptics.notification({type:'ERROR'})
              : Haptics.impact({style: kind === 'heavy' ? 'HEAVY' : kind === 'medium' ? 'MEDIUM' : 'LIGHT'});
      if(r && r.catch) r.catch(()=>{});
    }catch(e){}
    return;
  }
  try{ navigator.vibrate && navigator.vibrate(kind === 'fail' ? [30,40,60] : kind === 'medium' ? 20 : 10); }catch(e){}
}

// ---------- storage: native Preferences on iOS (survives updates), localStorage elsewhere ----------
const KEYS = ['best','gems','skin','muted'], cache = {};
const store = {
  async load(){
    for(const k of KEYS){
      let v = null;
      if(Prefs){ try{ v = (await Prefs.get({key:'upswing.'+k})).value; }catch(e){} }
      if(v == null){ try{ v = localStorage.getItem('upswing.'+k); }catch(e){} }
      if(v != null){ try{ cache[k] = JSON.parse(v); }catch(e){} }
    }
  },
  get(k, d){ return k in cache ? cache[k] : d; },
  set(k, v){
    cache[k] = v; const s = JSON.stringify(v);
    try{ localStorage.setItem('upswing.'+k, s); }catch(e){}
    if(Prefs){ try{ Prefs.set({key:'upswing.'+k, value:s}).catch(()=>{}); }catch(e){} }
  }
};

// ---------- constants ----------
const W = 400;                 // logical world width
const G = 1500;                // gravity, units/s^2
const L0 = 118;                // resting rope length
const AMP = 125*Math.PI/180;   // swing amplitude the rope pumps toward
const PUMP = 2.4;
const BOOST = 1.25;            // release flick: extra speed when letting go
const PR = 9;                  // player radius
const UNIT = 40;               // world units per metre (for altitude)
const SKINS = [
  {name:'Ember',  c:'#ffb547', need:0},
  {name:'Mint',   c:'#7df5c4', need:25},
  {name:'Rose',   c:'#ff7aa8', need:90},
  {name:'Glacier',c:'#7cc8ff', need:220},
  {name:'Prism',  c:'prism',   need:500},
];
const SCALE_STEPS = [0,2,4,7,9,12,14,16,19,21,24];

// ---------- dom ----------
const $ = id => document.getElementById(id);
const stage = $('stage'), cvs = $('game'), ctx = cvs.getContext('2d');
const hud = $('hud'), menu = $('menu'), over = $('over'), pausedOv = $('pausedOv');
const scoreEl = $('score'), altEl = $('alt'), gemEl = $('gemCount');

let H = 700, scale = 1, dpr = 1, safeB = 0;
function resize(){
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.max(1, Math.round(r.width*dpr));
  cvs.height = Math.max(1, Math.round(r.height*dpr));
  scale = (r.width*dpr)/W;
  H = r.height/r.width*W;
  const probe = $('insetProbe');
  safeB = probe ? (parseFloat(getComputedStyle(probe).paddingBottom) || 0)*W/r.width : 0;
}
window.addEventListener('resize', resize);

// ---------- helpers ----------
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
function hash(n){ const s = Math.sin(n*127.1 + 311.7)*43758.5453; return s - Math.floor(s); }

// ---------- audio ----------
let actx = null, muted = false;
function ensureAudio(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; } }
  if(actx && actx.state !== 'running') actx.resume().catch(()=>{});   // iOS also reports 'interrupted' after calls
}
function tone(freq, dur=.12, type='sine', vol=.14, slide=0, delay=0){
  if(!actx || muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(freq*slide, t+dur);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+.01);
  g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.03);
}
function whoosh(){
  if(!actx || muted) return;
  const t = actx.currentTime, len = .22;
  const buf = actx.createBuffer(1, actx.sampleRate*len, actx.sampleRate);
  const d = buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*(1-i/d.length);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type='bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(2200, t+len);
  const g = actx.createGain(); g.gain.value = .12;
  src.connect(f).connect(g).connect(actx.destination); src.start(t);
}
const SPEAKER_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const SPEAKER_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>';
function paintMute(){ $('muteBtn').innerHTML = muted ? SPEAKER_OFF : SPEAKER_ON; $('muteBtn').setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); }

// ---------- persistent meta ----------
let best = 0, totalGems = 0, skinIdx = 0;
function loadMeta(){
  best = store.get('best', 0);
  totalGems = store.get('gems', 0);
  skinIdx = store.get('skin', 0);
  muted = store.get('muted', false);
  if(!SKINS[skinIdx] || totalGems < SKINS[skinIdx].need) skinIdx = 0;
}

// ---------- world state ----------
let state = 'menu';            // menu | play | over | paused
let anchors = [], gems = [], parts = [], floats = [], trail = [];
let p, camTop, tideY, time = 0, runTime = 0, overAt = 0;
let score = 0, maxIdx = 0, combo = 0, streak = 0, runGems = 0, startY = 0, shake = 0, flash = 0;

function grabR(i){ return Math.max(34, 50 - i*0.22); }

// Can a release from anchor a (at full swing) carry the player within tol of b?
function reachable(a, b, tol){
  const L = L0, dt = 1/120;
  for(const dir of [1,-1]){
    for(let deg=-30; deg<=120; deg+=5){
      const th = dir*deg*Math.PI/180;
      const k = Math.cos(th) - Math.cos(AMP); if(k <= 0) continue;
      const om = BOOST*dir*Math.sqrt(2*G*L*k)/L;
      let x = a.x + L*Math.sin(th), y = a.y + L*Math.cos(th);
      let vx = L*om*Math.cos(th), vy = -L*om*Math.sin(th);
      for(let s=0; s<260; s++){
        vy += G*dt; x += vx*dt; y += vy*dt;
        if(x < PR){ x = PR; vx = -vx*.6; } else if(x > W-PR){ x = W-PR; vx = -vx*.6; }
        const dx = x-b.x, dy = y-b.y;
        if(dx*dx + dy*dy < tol*tol) return true;
        if(vy > 0 && y > b.y + 160) break;
      }
    }
  }
  return false;
}

function makeAnchor(i, x, y){
  const a = {i, bx:x, x, y, vx:0, amp:0, w:0, ph:0, fragile:false, breakAt:0, broken:false, pulse:0};
  if(i > 6 && Math.random() < Math.min(.45, .2 + i*.006)){ a.amp = rand(18, 34); a.w = rand(1.6, 2.6); a.ph = rand(0, 6.28); }
  if(i > 14 && Math.random() < Math.min(.3, .1 + i*.004)) a.fragile = true;
  return a;
}
function genNext(prev){
  const i = prev.i + 1, diff = Math.min(1, i/70), tol = grabR(i)*.55;
  for(let t=0; t<50; t++){
    const dy = lerp(55, 100, diff) + rand(-10, 22);
    const side = Math.random() < .5 ? -1 : 1;
    let x = prev.bx + side*rand(lerp(120, 140, diff), lerp(185, 210, diff));
    if(x < 36 || x > W-36) x = prev.bx - (x - prev.bx);
    x = clamp(x, 36, W-36);
    const c = {x, y: prev.y - dy};
    if(Math.hypot(c.x - prev.bx, c.y - prev.y) < lerp(145, 170, diff)) continue;   // keep rings outside the swing circle
    if(reachable({x:prev.bx, y:prev.y}, c, tol)) return makeAnchor(i, c.x, c.y);
  }
  const x = clamp(prev.bx + (prev.bx < W/2 ? 1 : -1)*150, 36, W-36);
  return makeAnchor(i, x, prev.y - 40);
}
function extendWorld(){
  while(anchors[anchors.length-1].y > camTop - 260){
    const prev = anchors[anchors.length-1];
    const n = genNext(prev);
    anchors.push(n);
    if(n.i > 1 && Math.random() < .42){
      const mx = (prev.bx + n.bx)/2 + rand(-20, 20), my = Math.min(prev.y, n.y) + rand(-50, 10);
      gems.push({x: clamp(mx, 24, W-24), y: my, taken:false, t: rand(0, 6)});
    }
  }
  const cut = camTop + H + 400;
  if(anchors.length > 4 && anchors[0].y > cut && anchors[0] !== p.anchor) anchors.shift();
  gems = gems.filter(g => g.y < cut && !(g.taken && g.t > 1));
}

function resetWorld(){
  anchors = []; gems = []; parts = []; floats = []; trail = [];
  const a0 = makeAnchor(0, W/2, 0);
  anchors.push(a0);
  p = {x:0, y:0, vx:0, vy:0, anchor:a0, theta:AMP*.85, omega:0, L:L0, last:null, relT:-9, near:false};
  syncAttached(0);
  camTop = -H*.42; startY = camTop;
  tideY = camTop + H + 200;
  score = 0; maxIdx = 0; combo = 0; streak = 0; runGems = 0; runTime = 0; shake = 0;
  extendWorld();
  updateHud();
}

// ---------- physics ----------
function syncAttached(){
  const a = p.anchor;
  p.x = a.x + p.L*Math.sin(p.theta);
  p.y = a.y + p.L*Math.cos(p.theta);
  p.vx = p.L*p.omega*Math.cos(p.theta) + a.vx;
  p.vy = -p.L*p.omega*Math.sin(p.theta);
}
function stepAttached(dt){
  const a = p.anchor;
  p.omega += -(G/p.L)*Math.sin(p.theta)*dt;
  if(Math.abs(p.L - L0) > .3){                       // reel toward rest length, conserving angular momentum
    const nl = p.L + (L0 - p.L)*Math.min(1, 7*dt);
    p.omega *= (p.L/nl)*(p.L/nl); p.L = nl;
  }
  const KE = .5*(p.L*p.omega)**2, PE = G*p.L*(1 - Math.cos(p.theta)), Et = G*p.L*(1 - Math.cos(AMP));
  if(KE + PE < Et){
    let nk = Math.min(KE + PUMP*G*p.L*dt, Et - PE);
    const s = p.omega === 0 ? (p.theta > 0 ? -1 : 1) : Math.sign(p.omega);
    p.omega = s*Math.sqrt(2*Math.max(nk, 0))/p.L;
  } else if(KE + PE > Et*1.2){
    p.omega *= 1 - 1.2*dt;
  }
  p.theta += p.omega*dt;
  syncAttached();
}
function release(){
  if(!p.anchor) return;
  p.last = p.anchor; p.relT = time; p.anchor = null; p.near = false;
  p.vx *= BOOST; p.vy *= BOOST;
  whoosh(); haptic('light');
}
function attach(a, d){
  const dx = p.x - a.x, dy = p.y - a.y, L = Math.max(d, 24);
  const th = Math.atan2(dx, dy);
  const vt = (p.vx - a.vx)*Math.cos(th) - p.vy*Math.sin(th);
  p.anchor = a; p.L = L; p.theta = th; p.omega = vt/L;
  if(a.fragile && !a.breakAt) a.breakAt = time + 1.15;
  a.pulse = 1;

  if(state !== 'play') return;
  const perfect = d < grabR(a.i)*.36;
  if(a.i > maxIdx){
    let pts = a.i - maxIdx;
    maxIdx = a.i;
    if(perfect){ combo++; pts += Math.min(combo, 5); } else combo = 0;
    score += pts;
    bumpScore();
    if(perfect){
      floats.push({x:a.x, y:a.y-24, text: combo > 1 ? `PERFECT ×${combo}` : 'PERFECT', c:'#ffd27a', life:1});
      flash = .35; shake = Math.max(shake, 3);
      tone(523*Math.pow(2, Math.min(combo,6)/12), .1, 'triangle', .12); tone(784*Math.pow(2, Math.min(combo,6)/12), .18, 'triangle', .1, 0, .07);
      burst(a.x, a.y, 18, '#ffd27a', 260);
    } else {
      floats.push({x:a.x, y:a.y-22, text:'+'+pts, c:'#f6eefc', life:.8});
    }
    if(pts > 1 && a.i - (maxIdx - pts) > 1 && !perfect) floats[floats.length-1].text = `SKIP +${pts}`;
    if(score >= 25 && (score - pts) < 25) milestone('25!');
    else if(Math.floor(score/50) > Math.floor((score-pts)/50)) milestone(`${Math.floor(score/50)*50}!`);
  }
  streak++;
  const n = SCALE_STEPS[Math.min(streak-1, SCALE_STEPS.length-1)];
  tone(392*Math.pow(2, n/12), .14, 'sine', .16, 1.01);
  haptic(perfect ? 'medium' : 'light');
  burst(a.x, a.y, 8, '#9ff0d0', 120);
}
function milestone(t){ floats.push({x:W/2, y:camTop + H*.3, text:t, c:'#9ff0d0', life:1.4, big:true}); }
function stepFree(dt){
  p.vy += G*dt; p.x += p.vx*dt; p.y += p.vy*dt;
  if(p.x < PR){ p.x = PR; p.vx = -p.vx*.6; tone(220, .05, 'square', .04); }
  else if(p.x > W-PR){ p.x = W-PR; p.vx = -p.vx*.6; tone(220, .05, 'square', .04); }
  for(const a of anchors){
    if(a.broken) continue;
    if(a === p.last && time - p.relT < .35) continue;
    const dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy), R = grabR(a.i);
    if(d < R){ attach(a, d); return; }
    if(a.i > maxIdx && d < R*1.4) p.near = true;
  }
}

// ---------- effects ----------
function burst(x, y, n, c, sp){
  for(let i=0;i<n;i++){ const ang = rand(0, 6.283), s = rand(.3, 1)*sp;
    parts.push({x, y, vx:Math.cos(ang)*s, vy:Math.sin(ang)*s, life:1, max:rand(.4,.8), c, r:rand(1.5,3.5)}); }
}
function bumpScore(){ scoreEl.textContent = score; scoreEl.classList.add('bump'); setTimeout(()=>scoreEl.classList.remove('bump'), 110); }
function skinColor(t){
  const s = SKINS[skinIdx].c;
  return s === 'prism' ? `hsl(${(time*120 + (t||0)*40) % 360} 95% 68%)` : s;
}

// ---------- game flow ----------
function startRun(){
  state = 'play'; runTime = 0;
  menu.hidden = true; over.hidden = true; pausedOv.hidden = true; hud.hidden = false;
  tideY = camTop + H + 120;
  floats.push({x:W/2, y:camTop + H*.78, text:'Tap to let go', c:'#f6eefc', life:2.2});
  updateHud();
}
function die(cause){
  if(state !== 'play') return;
  state = 'over'; overAt = time; shake = 10;
  burst(p.x, Math.min(p.y, tideY), 30, skinColor(), 320);
  tone(180, .4, 'sawtooth', .12, .4); haptic('fail');
  const isBest = score > best;
  if(isBest){ best = score; store.set('best', best); }
  totalGems += runGems; store.set('gems', totalGems);
  setTimeout(() => {
    if(state !== 'over') return;
    $('cause').textContent = cause;
    $('finalScore').textContent = score;
    $('newBest').hidden = !(isBest && score > 0);
    $('overBest').textContent = best;
    $('overAlt').textContent = Math.max(0, Math.round((startY - camTop)/UNIT)) + ' m';
    $('overGems').textContent = '+' + runGems;
    hud.hidden = true; over.hidden = false;
  }, 550);
}
function toMenu(){
  resetWorld(); state = 'menu';
  over.hidden = true; hud.hidden = true; menu.hidden = false; buildSwatches();
}
function updateHud(){
  scoreEl.textContent = score;
  altEl.textContent = Math.max(0, Math.round((startY - camTop)/UNIT)) + ' m';
  gemEl.textContent = totalGems + runGems;
}
function buildSwatches(){
  $('menuBest').textContent = best; $('menuGems').textContent = totalGems;
  const box = $('swatches'); box.innerHTML = '';
  SKINS.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'swatch'; b.id = 'skin-'+i;
    const locked = totalGems < s.need;
    b.disabled = locked;
    b.setAttribute('aria-pressed', String(i === skinIdx));
    b.setAttribute('aria-label', locked ? `${s.name}, unlocks at ${s.need} gems` : s.name);
    const dot = document.createElement('i');
    dot.style.background = s.c === 'prism' ? 'conic-gradient(#ff7aa8,#ffb547,#7df5c4,#7cc8ff,#c99bff,#ff7aa8)' : s.c;
    if(!locked) dot.style.boxShadow = `0 0 14px ${s.c === 'prism' ? '#c99bff' : s.c}`;
    b.appendChild(dot);
    if(locked){ const sm = document.createElement('small'); sm.textContent = s.need; b.appendChild(sm); }
    b.addEventListener('pointerdown', e => e.stopPropagation());
    b.addEventListener('click', e => { e.stopPropagation(); if(locked) return; skinIdx = i; store.set('skin', i); buildSwatches(); tone(660, .08, 'triangle', .1); });
    box.appendChild(b);
  });
  const next = SKINS.find(s => totalGems < s.need);
  $('skinName').textContent = SKINS[skinIdx].name + (next ? ` · next unlock at ${next.need} gems` : ' · all unlocked');
}

// ---------- input ----------
function onTap(){
  ensureAudio();
  if(state === 'menu'){ startRun(); return; }
  if(state === 'paused'){ state = 'play'; pausedOv.hidden = true; hud.hidden = false; last = performance.now(); return; }
  if(state === 'play'){ release(); return; }
  if(state === 'over' && time - overAt > .9 && !over.hidden){ resetWorld(); startRun(); }
}
stage.addEventListener('pointerdown', e => { if(e.button > 0) return; e.preventDefault(); onTap(); });
stage.addEventListener('touchend', ensureAudio, {passive:true});   // iOS unlocks Web Audio on touchend
try{ if(navigator.audioSession) navigator.audioSession.type = 'ambient'; }catch(e){}
window.addEventListener('keydown', e => {
  if(e.repeat) return;
  if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter'){
    if(document.activeElement && document.activeElement.tagName === 'BUTTON' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
    e.preventDefault(); onTap();
  }
});
$('muteBtn').addEventListener('pointerdown', e => e.stopPropagation());
$('muteBtn').addEventListener('click', e => { e.stopPropagation(); muted = !muted; store.set('muted', muted); paintMute(); ensureAudio(); });
$('toMenu').addEventListener('pointerdown', e => e.stopPropagation());
$('toMenu').addEventListener('click', e => { e.stopPropagation(); toMenu(); });
document.addEventListener('visibilitychange', () => {
  if(document.hidden && state === 'play'){ state = 'paused'; pausedOv.hidden = false; hud.hidden = true; }
});

// ---------- update ----------
function update(dt){
  time += dt;
  const sub = 4, h = dt/sub;
  for(let s=0; s<sub; s++){
    for(const a of anchors){ if(a.amp){ const nx = a.bx + a.amp*Math.sin(time*a.w + a.ph); a.vx = (nx - a.x)/h || 0; a.x = nx; } }
    if(p.anchor) stepAttached(h); else stepFree(h);
  }
  for(const a of anchors){
    if(a.pulse > 0) a.pulse = Math.max(0, a.pulse - dt*2.5);
    if(a.fragile && a.breakAt && !a.broken && time > a.breakAt){
      a.broken = true; burst(a.x, a.y, 14, '#ff8a6b', 160); tone(300, .12, 'square', .07, .5);
      if(p.anchor === a){ release(); haptic('heavy'); }
    }
  }

  if(state === 'play'){
    runTime += dt;
    for(const g of gems){
      if(g.taken){ g.t += dt; continue; }
      if(Math.hypot(p.x - g.x, p.y - g.y) < 24){
        g.taken = true; g.t = 0; runGems++;
        tone(1318, .09, 'triangle', .1); tone(1760, .12, 'triangle', .08, 0, .05);
        burst(g.x, g.y, 10, '#9ff0d0', 140); updateHud();
      }
    }
    const speed = runTime < 2.5 ? 0 : Math.min(24 + score*1.05, 92);
    tideY -= speed*dt;
    tideY = Math.min(tideY, camTop + H - 18 - safeB);
  }

  // camera only rises
  const focus = p.anchor ? Math.min(p.anchor.y + 30, p.y) : p.y;
  const target = focus - H*.5;
  if(target < camTop) camTop += (target - camTop)*Math.min(1, 3.5*dt);
  extendWorld();

  if(state === 'play'){
    if(p.y > tideY - 4) die(p.near ? 'Missed by a hair' : 'The tide got you');
    else if(p.y > camTop + H + 40) die(p.near ? 'Missed by a hair' : 'Fell into the dark');
    updateHud();
  }

  trail.push({x:p.x, y:p.y}); if(trail.length > 16) trail.shift();
  for(const q of parts){ q.vy += 400*dt; q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt/q.max; }
  parts = parts.filter(q => q.life > 0);
  for(const f of floats){ f.y -= 34*dt; f.life -= dt*.9; }
  floats = floats.filter(f => f.life > 0);
  shake = Math.max(0, shake - dt*30); flash = Math.max(0, flash - dt*1.6);
}

// ---------- render ----------
function draw(){
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  ctx.setTransform(scale, 0, 0, scale, sx*scale, sy*scale);
  const climb = Math.max(0, startY - camTop);
  const hue = 268 - Math.min(climb/90, 70) + 10*Math.sin(climb/1800);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, `hsl(${hue} 52% ${Math.max(5, 11 - climb/2000)}%)`);
  bg.addColorStop(1, `hsl(${hue+28} 45% 20%)`);
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W+40, H+40);

  // parallax stars
  for(let layer=0; layer<2; layer++){
    const f = layer ? .55 : .25, cell = 70, off = camTop*f;
    const c0 = Math.floor(off/cell) - 1, c1 = Math.floor((off+H)/cell) + 1;
    for(let c=c0; c<=c1; c++){
      for(let j=0; j<3; j++){
        const k = c*13 + j*7 + layer*1000;
        const x = hash(k)*W, y = c*cell + hash(k+3)*cell - off;
        const tw = .5 + .5*Math.sin(time*(1 + hash(k+5)*2) + k);
        ctx.globalAlpha = (layer ? .55 : .3)*(.4 + .6*tw) + Math.min(climb/8000, .3);
        ctx.fillStyle = '#f6eefc';
        const r = layer ? 1.3 : .8; ctx.fillRect(x, y, r, r);
      }
    }
  }
  ctx.globalAlpha = 1;

  // rings
  for(const a of anchors){
    const y = a.y - camTop;
    if(y < -60 || y > H + 60 || a.broken) continue;
    const R = grabR(a.i);
    let ax = a.x, col = a.fragile ? '#ff8a6b' : '#9ff0d0';
    if(a.fragile && a.breakAt){ const left = a.breakAt - time; ax += Math.sin(time*60)*(1.2 - left)*2.5; }
    if(a.amp){
      ctx.strokeStyle = 'rgba(159,240,208,.14)'; ctx.lineWidth = 2; ctx.setLineDash([2,6]);
      ctx.beginPath(); ctx.moveTo(a.bx - a.amp, y); ctx.lineTo(a.bx + a.amp, y); ctx.stroke(); ctx.setLineDash([]);
    }
    const near = !p.anchor && Math.hypot(p.x - a.x, p.y - a.y) < R*1.6;
    if(a !== p.anchor){
      ctx.strokeStyle = col; ctx.globalAlpha = near ? .45 : (a.i > maxIdx ? .16 : .07);
      ctx.lineWidth = 1.5; ctx.setLineDash([3,5]);
      ctx.beginPath(); ctx.arc(ax, y, R, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
    if(a.pulse){ ctx.strokeStyle = col; ctx.globalAlpha = a.pulse*.7; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ax, y, 8 + (1-a.pulse)*30, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.shadowColor = col; ctx.shadowBlur = 14;
    ctx.strokeStyle = col; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.arc(ax, y, 7, 0, 6.283); ctx.stroke();
    if(a.fragile){ ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(ax-3, y-8); ctx.lineTo(ax+1, y-2); ctx.lineTo(ax-2, y+2); ctx.stroke(); }
    ctx.shadowBlur = 0;
  }

  // gems
  for(const g of gems){
    const y = g.y - camTop; if(y < -30 || y > H + 30) continue;
    if(g.taken){ if(g.t > .4) continue; ctx.globalAlpha = 1 - g.t/.4; }
    const s = 6 + (g.taken ? g.t*30 : Math.sin(time*4 + g.t)*1);
    ctx.save(); ctx.translate(g.x, y + (g.taken ? -g.t*40 : Math.sin(time*2 + g.t)*3)); ctx.rotate(Math.PI/4 + time*.6);
    ctx.shadowColor = '#9ff0d0'; ctx.shadowBlur = 12; ctx.fillStyle = '#d8fff0';
    ctx.fillRect(-s/2, -s/2, s, s); ctx.restore(); ctx.globalAlpha = 1;
  }

  // rope
  if(p.anchor){
    ctx.strokeStyle = 'rgba(246,238,252,.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p.anchor.x, p.anchor.y - camTop); ctx.lineTo(p.x, p.y - camTop); ctx.stroke();
  }

  // trail + player
  const dead = state === 'over';
  if(!dead){
    for(let i=1; i<trail.length; i++){
      const t = i/trail.length;
      ctx.strokeStyle = skinColor(i); ctx.globalAlpha = t*.55; ctx.lineWidth = PR*1.6*t;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(trail[i-1].x, trail[i-1].y - camTop); ctx.lineTo(trail[i].x, trail[i].y - camTop); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.shadowColor = skinColor(); ctx.shadowBlur = 22;
    ctx.fillStyle = skinColor(); ctx.beginPath(); ctx.arc(p.x, p.y - camTop, PR, 0, 6.283); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(p.x - 2.5, p.y - camTop - 2.5, 3, 0, 6.283); ctx.fill();
  }

  // particles
  for(const q of parts){ ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y - camTop, q.r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;

  // tide
  const ty = tideY - camTop;
  if(ty < H + 40){
    const grd = ctx.createLinearGradient(0, ty - 30, 0, H);
    grd.addColorStop(0, 'rgba(255,77,109,0)'); grd.addColorStop(.18, 'rgba(255,77,109,.9)'); grd.addColorStop(1, '#5a0f2c');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.moveTo(-20, H + 40);
    for(let x=-20; x<=W+20; x+=10) ctx.lineTo(x, ty + Math.sin(x*.045 + time*3)*5 + Math.sin(x*.11 - time*2)*2.5);
    ctx.lineTo(W+20, H + 40); ctx.closePath();
    ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,200,210,.5)';
    for(let i=0; i<10; i++){ const bx = (hash(i)*W + time*12*(i%2?1:-1) + W) % W, by = ty + 14 + ((time*30 + hash(i+9)*200) % Math.max(20, H - ty));
      ctx.fillRect(bx, by, 2, 2); }
  }

  // floating text
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const f of floats){
    ctx.globalAlpha = Math.min(1, f.life*2); ctx.fillStyle = f.c;
    ctx.font = `${f.big ? 46 : 20}px "Lilita One", "Arial Rounded MT Bold", sans-serif`;
    ctx.fillText(f.text, clamp(f.x, 70, W-70), f.y - camTop);
  }
  ctx.globalAlpha = 1;

  if(flash){ ctx.fillStyle = `rgba(255,210,122,${flash*.18})`; ctx.fillRect(-20, -20, W+40, H+40); }
}

// ---------- loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(.033, (now - last)/1000); last = now;
  if(state !== 'paused') update(dt);
  draw();
  requestAnimationFrame(frame);
}

function start(){
  loadMeta(); resize(); paintMute(); resetWorld(); buildSwatches();
  requestAnimationFrame(t => { last = t; frame(t); });
}
const fontsReady = document.fonts ? document.fonts.load('20px "Lilita One"').catch(()=>{}) : Promise.resolve();
Promise.all([store.load().catch(()=>{}), fontsReady]).then(start, start);
})();
</script>
</body>
</html>
